name: Build HexHaki

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: ./gradlew --no-daemon validateHakiResources build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: hexhaki-v2-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
